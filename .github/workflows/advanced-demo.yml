# ─────────────────────────────────────────────────────────────
# ADVANCED ACTIONS DEMO — all 4 concepts in one workflow
# 1. artifacts   2. caching   3. reusable workflows   4. workflow_dispatch
# ─────────────────────────────────────────────────────────────
name: Advanced Actions Demo

# CONCEPT 4 (workflow_dispatch): run by hand with a UI form.
# GitHub shows a "Run workflow ▾" button + input fields.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      build:
        description: 'Run the full build?'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ── CONCEPT 3: call the reusable workflow instead of
  #    copy-pasting checkout/pnpm/install steps everywhere ──
  build:
    name: Reusable build job
    uses: ./.github/workflows/reusable-setup.yml
    with:
      build: ${{ inputs.build }}

  # ── CONCEPT 1 + 2: download the artifact, use cached deps ──
  inspect:
    name: Download & inspect artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact (concept 1)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Show downloaded files
        run: |
          find dist -type f | head -20
          echo "Artifact downloaded successfully!"

      - name: Cache demo (concept 2)
        uses: actions/cache@v4
        with:
          path: .cache-demo
          key: demo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Read workflow_dispatch input (concept 4)
        run: |
          echo "Target environment: ${{ inputs.environment }}"
          echo "Build requested:    ${{ inputs.build }}"
          echo "Repository:         ${{ github.repository }}"
          echo "Triggered by:       ${{ github.actor }}"
