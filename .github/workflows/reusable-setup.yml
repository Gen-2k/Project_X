# ─────────────────────────────────────────────────────────────
# REUSABLE WORKFLOW  (concept 3)
# `on: workflow_call` turns this into a shared library.
# Any other workflow can call it with `uses:`.
# ─────────────────────────────────────────────────────────────
name: Reusable Setup + Build

on:
  workflow_call:
    # Inputs = parameters you can pass from the caller workflow
    inputs:
      build:
        description: 'Run the turbo build?'
        type: boolean
        required: false
        default: false

jobs:
  setup:
    name: Reusable install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CONCEPT 2 (caching): pnpm deps are cached across runs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Extra explicit cache example: Turborepo's own cache dir
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build monorepo
        if: ${{ inputs.build }}
        run: pnpm exec turbo run build

      # CONCEPT 1 (artifacts): save build output so other jobs/repos
      # can download it later — survives after this job ends.
      - name: Upload build artifact
        if: ${{ inputs.build }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            apps/client/dist
            apps/server/dist
          if-no-files-found: warn
